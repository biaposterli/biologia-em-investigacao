<style>
/* Layout: mesa da professora — cabeçalho com estado da conexão, abas (visão geral, correção, por aluno, formulários) e conteúdo em largura total */
:root{
  --bg:#eef0e9; --surface:#fcfcf9; --surface-2:#e4e9e1; --ink:#17231d; --muted:#556459; --line:#d3dbd0;
  --accent:#1d6b58; --accent-soft:#d6e9e1; --ochre:#a3601b; --ochre-soft:#f3e3cd; --sky:#2a6497; --sky-soft:#dae7f2; --berry:#8a3560; --berry-soft:#f1dde7;
  --good:#2b7a4b; --good-soft:#dbefe1; --mid:#9a6a0c; --mid-soft:#f6ead0; --bad:#b03c35; --bad-soft:#f7e0dd;
  --shadow:0 1px 0 rgba(23,35,29,.04), 0 10px 28px -18px rgba(23,35,29,.3);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#161f1a; --surface-2:#202b25; --ink:#e3ebe5; --muted:#9aab9f; --line:#2a3731;
  --accent:#4cb596; --accent-soft:#183329; --ochre:#e2a25a; --ochre-soft:#33261a; --sky:#77acdb; --sky-soft:#18293a; --berry:#e08ab3; --berry-soft:#33192a;
  --good:#5cc08a; --good-soft:#163222; --mid:#e2b456; --mid-soft:#33290f; --bad:#ec7d72; --bad-soft:#3a1d1a;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161f1a; --surface-2:#202b25; --ink:#e3ebe5; --muted:#9aab9f; --line:#2a3731;
  --accent:#4cb596; --accent-soft:#183329; --ochre:#e2a25a; --ochre-soft:#33261a; --sky:#77acdb; --sky-soft:#18293a; --berry:#e08ab3; --berry-soft:#33192a;
  --good:#5cc08a; --good-soft:#163222; --mid:#e2b456; --mid-soft:#33290f; --bad:#ec7d72; --bad-soft:#3a1d1a;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px}

.top-row .sub{color:var(--muted);font-size:.86rem}

.conn{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.conn i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.conn.ok i{background:var(--good)} .conn.err i{background:var(--bad)} .conn.load i{background:var(--mid)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
nav.tabs button{flex:none;border:1px solid transparent;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:700}
nav.tabs button:hover{background:var(--surface);color:var(--ink)}
nav.tabs button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
main{padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.sm{padding:4px 10px;font-size:.8rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.label{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.note{font-size:.85rem;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.mid{background:var(--mid-soft);color:var(--mid)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--sky-soft);color:var(--sky)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-weight:700;border-right:1px solid var(--line);min-width:2.4em}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface);position:sticky;top:0}
td.c,th.c{text-align:center}
tr:last-child td{border-bottom:0}
.cell{display:inline-flex;align-items:center;justify-content:center;min-width:44px;padding:3px 6px;border-radius:7px;font-family:var(--f-mono);font-weight:600;font-size:.85rem;cursor:pointer;border:1px solid transparent}
.cell.none{color:var(--muted);cursor:default}
.cell.g{background:var(--good-soft);color:var(--good)} .cell.m{background:var(--mid-soft);color:var(--mid)} .cell.b{background:var(--bad-soft);color:var(--bad)}
.cell.pend{border-style:dashed;border-color:currentColor}
.cell:hover:not(.none){filter:brightness(.95)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.86rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.chip small{font-family:var(--f-mono);opacity:.8}
.resp{display:flex;flex-direction:column;gap:12px}
.resp-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.resp-head .who{display:flex;flex-direction:column}
.resp-head .who b{font-size:1.05rem}
.nota{margin-left:auto;text-align:right}
.nota b{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1}
.obj{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:.88rem}
.obj .ok{color:var(--good);font-weight:800} .obj .no{color:var(--bad);font-weight:800}
.open-q{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.open-q blockquote{margin:0;padding:8px 12px;background:var(--bg);border-left:3px solid var(--sky);border-radius:0 8px 8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.bar{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 140px 46px;gap:10px;align-items:center;font-size:.86rem}
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.fcard{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.qr{background:#fff;border-radius:10px;padding:8px;line-height:0}
.qr svg{width:150px;height:150px}
.link{font-family:var(--f-mono);font-size:.8rem;overflow-wrap:anywhere;color:var(--sky)}
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.88);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;color:#fff;text-align:center}
.overlay .qr svg{width:min(70vmin,560px);height:min(70vmin,560px)}
.overlay h2{color:#fff;font-size:clamp(1.4rem,3.5vw,2.6rem)}
.overlay .link{color:#cfe3ef;font-size:1.2rem}
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
pre.code{max-height:220px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.75rem;font-family:var(--f-mono);white-space:pre}
.err{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);border-radius:10px;padding:10px 14px}
.warn{background:var(--mid-soft);border:1px solid color-mix(in srgb,var(--mid) 50%,transparent);border-radius:10px;padding:10px 14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);align-items:center}
.legend .cell{cursor:default;min-width:34px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="stack" style="gap:0">
        <h1>Painel de Avaliação</h1>
        <span class="sub" id="sub">Biologia em Investigação · fichas enviadas pelos estudantes</span>
      </div>
      <div class="top-actions">
        <a class="btn sm" href="index.html">← Portal</a><span class="conn load" id="conn"><i></i><span>Conectando…</span></span>
        <a class="btn sm" id="sheetLink" href="#" target="_blank" rel="noopener" hidden>Planilha</a><button class="btn sm" id="btnConn" type="button">Conexão</button>
        <button class="btn sm primary" id="btnRefresh">Atualizar</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Seções">
      <button data-v="geral">Visão geral</button>
      <button data-v="correcao">Correção</button>
      <button data-v="aluno">Por estudante</button>
      <button data-v="forms">Envios</button>
      <button data-v="senhas">Senhas dos estudantes</button>
    </nav>
  </div>
</header>
<div class="wrap"><div class="warn" id="unsaved" hidden style="margin-top:14px">Há correções não salvas. Salve antes de atualizar, ou <button class="btn sm" onclick="dirty.clear();this.parentNode.hidden=true;loadAll();">atualizar mesmo assim</button></div></div>
<main class="wrap" id="main"></main>
<script src="portal.js"></script>
<script src="specs.js"></script>
<script>
// Fichas dos quatro sites (specs.js). O código de cada ficha leva o nome do site: "Ecologia · Aula 01".
const P=window.PORTAL;
const SITES={};P.ORDER.forEach(k=>SITES[k]=P.SITES[k].nome);
const ALL=[];
P.ORDER.forEach(k=>(window.SPECS[k]||[]).forEach(f=>{const g=Object.assign({},f);g.site=k;g.raw=f.code;g.code=P.codeFor(k,f.code);
  const m=String(f.titulo).match(/^Aulas?\s+(\d+)(?:\s*e\s*(\d+))?/);g.short=m?(m[2]?m[1]+'–'+m[2]:m[1]):g.code.slice(-2);ALL.push(g);}));
let SITE=(()=>{try{return localStorage.getItem('bi-painel-site')||'cel'}catch(e){return 'cel'}})();if(!SITES[SITE])SITE='cel';
let SPEC=ALL.filter(f=>f.site===SITE);
function setSite(v){SITE=v;try{localStorage.setItem('bi-painel-site',v)}catch(e){}SPEC=ALL.filter(f=>f.site===SITE);UI.ativ=SPEC[0].code;UI.aluno=null;UI.focus=null;render();}
const SHORT=Object.fromEntries(ALL.map(f=>[f.code,f.short]));
let SHEET_URL='';

// ================= Utilidades =================
const $=(q,r=document)=>r.querySelector(q);
const $$=(q,r=document)=>[...r.querySelectorAll(q)];
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v===true?'':v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const fmt=(n,d=1)=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
function num(v){if(v==null)return NaN;let s=String(v).trim().replace(/\s/g,'');if(!s)return NaN;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(',','.');s=s.replace(/[^0-9.\-]/g,'');return parseFloat(s);}
const sheetRange=(tab,rng)=>"'"+tab.replace(/'/g,"''")+"'!"+rng;
function seg(opts,val,on){const w=h('div',{class:'seg'});opts.forEach(([v,t])=>{const b=h('button',{type:'button','aria-pressed':String(v===val)},t);b.onclick=()=>{$$('button',w).forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');on(v);};w.append(b);});return w;}
function notaClass(n){return n==null?'none':n>=7?'g':n>=5?'m':'b';}

// ================= Estado =================
const S={tabs:[],forms:[],resp:{},aval:{},avalRows:0,alunos:[],estudantes:[],errors:{},loadedAt:null,loading:false};
const UI={verSenhas:false,buscaSenha:'',turmaSenha:'todas',view:'geral',turma:'todas',ativ:SPEC[0].code,status:'todos',busca:'',aluno:null,focus:null,conn:false};
let CONN=null,DEMO=false;
const dirty=new Set();

// ================= Conexão com o receptor do professor =================
function connCfg(){const p=P.prof()||{};const c=P.lsGet('bi-painel-conn',null)||{};return {r:c.r||p.r||'',senha:c.senha||p.senha||''};}
function errMsg(e){
  if(e&&e.code==='senha')return 'A senha não confere. Ela está na Área do professor e também no código do Apps Script (SENHA_PAINEL).';
  if(e&&e.code==='rede')return P.standalone()?'Não consegui falar com o receptor. Confira a internet e se a implantação está como “Qualquer pessoa”.':'Dentro do Claude o painel não consegue falar com o Google. Abra o painel pelo portal publicado (por exemplo, no Cloudflare) ou veja como ele funciona com dados de exemplo.';
  return (e&&e.message)||'Não foi possível ler a planilha.';}
function setConn(state,text){const c=$('#conn');c.className='conn '+state;c.lastChild.textContent=text;}
async function apiGet(params){let r;try{r=await fetch(P.urlDoReceptor(CONN.r)+'?'+new URLSearchParams(params),{cache:'no-store'});}catch(e){throw {code:'rede'};}
  let j;try{j=await r.json();}catch(e){throw {code:'rede'};}if(!j||!j.ok)throw {code:(j&&j.erro)||'erro',message:j&&j.texto};return j;}
async function saveRow(row){if(DEMO)return;let r;try{r=await fetch(P.urlDoReceptor(CONN.r),{method:'POST',body:JSON.stringify({acao:'nota',senha:CONN.senha,linha:row})});}catch(e){throw {code:'rede'};}
  let j;try{j=await r.json();}catch(e){throw {code:'rede'};}if(!j||!j.ok)throw {code:(j&&j.erro)||'erro',message:j&&j.texto};}
function applyData(abas){
  S.versaoRec=null;
  S.tabs=Object.keys(abas||{});S.forms=[];S.resp={};S.aval={};S.alunos=[];
  const al=abas['Alunos']||[];S.alunos=al.slice(1).filter(r=>r[0]&&String(r[0]).trim()).map(r=>({nome:String(r[0]).trim(),turma:P.rotuloTurma(r[3],r[1]),grupo:String(r[2]||'').trim()}));
  const es=abas['Estudantes']||[];S.estudantes=es.slice(1).filter(r=>r[1]&&String(r[1]).trim()).map(r=>({nome:String(r[1]).trim(),escola:String(r[2]||'').trim(),turma:P.rotuloTurma(r[2],r[3]),grupo:String(r[4]||'').trim(),senha:String(r[5]||'').trim(),criado:String(r[6]||''),quando:String(r[7]||'')}));
  const av=abas['Avaliação']||[];av.slice(1).forEach((r,i)=>{if(!r[0])return;let man={};try{man=JSON.parse(r[7]||'{}')}catch(e){}S.aval[r[0]]={row:i+2,man,nota:r[8]===''||r[8]==null?null:num(r[8]),coment:r[9]||'',quando:r[10]||''};});S.avalRows=av.length;
  ALL.forEach(f=>{S.resp[f.code]=abas[f.code]?parseResp(f,abas[f.code]):[];});
}
async function loadAll(){
  if(S.loading)return;
  if(!DEMO&&!(CONN&&CONN.r&&CONN.senha)){setConn('err','Não conectado');render();return;}
  S.loading=true;S.errors={};$('#btnRefresh').disabled=true;setConn('load',DEMO?'Montando exemplo…':'Lendo a planilha…');
  try{
    if(DEMO){applyData(S.demo||(S.demo=demoData()));SHEET_URL='';}
    else{const j=await apiGet({acao:'dados',senha:CONN.senha});SHEET_URL=j.planilha||'';$('#sub').textContent='Biologia em Investigação · fichas de '+(j.professor||'professor');applyData(j.abas);}
    S.loadedAt=new Date();
    setConn(DEMO?'load':'ok',DEMO?'Dados de exemplo':'Atualizado às '+S.loadedAt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){S.errors.page=e&&e.code?e:{code:'rede'};S.loadedAt=null;setConn('err','Sem conexão');}
  const sl=$('#sheetLink');sl.hidden=!SHEET_URL;if(SHEET_URL)sl.href=SHEET_URL;
  S.loading=false;$('#btnRefresh').disabled=false;render();
}

// ================= Leitura e correção =================
function parseResp(f,values){
  if(!values||values.length<2)return[];
  const hdr=values[0].map(x=>String(x).trim());const ix=t=>hdr.indexOf(t);
  const iN=ix('Nome completo'),iT=ix('Turma'),iG=ix('Grupo'),iE=ix('Escola');
  return values.slice(1).map((r,i)=>{if(!r.some(c=>String(c).trim()))return null;const a={};hdr.forEach((t,j)=>a[t]=r[j]!=null?String(r[j]):'');
    const nome=String(r[iN]||'').trim();const ts=String(r[0]||'');
    return {code:f.code,f,row:i+2,ts,nome,nk:norm(nome),turma:P.rotuloTurma(iE>=0?r[iE]:'',r[iT]),grupo:String(r[iG]||'').trim(),a,key:f.code+'|'+ts+'|'+norm(nome)};}).filter(Boolean);
}
function auto(r){
  const f=r.f;const items=[];let pts=0,max=0;
  const val=t=>r.a[t]!=null?r.a[t]:'';
  let quad=null;

      if(v===0){box.append(h('h3',{},'Nenhuma senha ainda'),h('p',{},'Não consegui conferir a versão do seu receptor agora. Na Área do professor, use “Testar o receptor”.'),abrir);return;}

    h('label',{class:'stack',style:'gap:4px'},h('span',{class:'label'},'Senha do painel'),pw),

    h('p',{class:'note'},'Ainda não tem receptor? ',h('a',{href:'professor.html'},'Configure na Área do professor'),'. Se você configurou neste navegador, o endereço e a senha já aparecem preenchidos.'));

function demoData(){
  const NOMES=['Ana Clara Souza','Bruno Lima','Camila Rocha','Davi Nascimento','Eduarda Alves','Felipe Moura','Gabriela Freitas','Heitor Santos','Isabela Costa','João Pedro Melo','Larissa Dias','Mateus Pereira'];
  const TUR=['1ºA','1ºB','2ºA','3ºC'];const rnd=(()=>{let x=7;return()=>{x=(x*16807)%2147483647;return (x-1)/2147483646;};})();
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const TXT=['Porque a célula realiza todas as funções vitais e se origina de outra célula.','Os dados mostram que o tratamento com cobertura reteve mais água do que o controle.','Observei a parede celular e o núcleo; não consegui distinguir as mitocôndrias.','A hipótese se confirmou em parte: as réplicas variaram, mas a tendência se manteve.','Faltam dados de mais réplicas para afirmar com segurança.'];
  const abas={},av=[['Chave','Atividade','Turma','Nome','Grupo','Pontos automáticos','Máximo automático','Pontos das abertas','Nota','Comentário','Atualizado em']];
  const alunos=[['Nome completo','Turma','Grupo']];NOMES.forEach((n,i)=>alunos.push([n,TUR[i%TUR.length],String(1+i%4)]));abas['Alunos']=alunos;
  ALL.forEach((f,fi)=>{const it=f.itens.filter(x=>x.k!=='hdr');const cab=['Carimbo de data/hora','Nome completo','Turma','Grupo'].concat(it.map(x=>x.t)).concat(['ID do envio']);const rows=[cab];
    NOMES.forEach((n,i)=>{if(rnd()<.3)return;const d=new Date(2026,9,1+(fi%20),7+i%5,10+i*3);const ts=('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':00';
      const r=[ts,n,TUR[i%TUR.length],String(1+i%4)];
      it.forEach(x=>{let v='';if(x.k==='mc')v=x.key&&rnd()<.72?x.key:pick(x.ch);else if(x.k==='num')v=x.key!=null&&rnd()<.7?String(x.key).replace('.',','):String(Math.round(rnd()*40));else if(x.k==='par')v=pick(TXT);else v='Exemplo de resposta curta';r.push(v);});
      r.push('demo'+fi+'-'+i);rows.push(r);});
    abas[f.code]=rows;});
  const est=[['Chave','Nome completo','Escola','Turma','Grupo','Senha','Criado em','Atualizado em']];NOMES.slice(0,8).forEach((n,i)=>est.push([n.toLowerCase(),n,'',TUR[i%TUR.length],String(1+i%4),String(1000+Math.floor(rnd()*9000)),'01/10/2026 08:0'+i,'15/10/2026 10:'+(10+i)]));abas['Estudantes']=est;
  abas['Avaliação']=av;return abas;
}
