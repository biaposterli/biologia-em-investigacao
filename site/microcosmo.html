<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="icon" href="icons/microcosmo.svg" type="image/svg+xml"><link rel="icon" href="icons/microcosmo-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="icons/microcosmo-180.png"></head><body>
<script>window.PORTAL_SITE='mic';</script><script src="portal.js"></script>
<title>Microcosmo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: caderno quadriculado; cada tema tem uma cor (t1 magenta, t2 âmbar, t3 anil, t4 verde-azulado, t5 violeta); cada aula abre com uma faixa colorida.
   NÃO ALTERE estas cores, fontes e medidas: elas são a identidade visual da coleção de sites. */
:root{
  --bg:#edf0f4; --grid:#dde3eb; --surface:#fbfcfd; --surface-2:#e6eaf0; --ink:#1a1f2b; --muted:#566074; --line:#d4dae3;
  --t1:#a3336b; --t1-soft:#f6dfeb; --t2:#9a5a10; --t2-soft:#f5e5cd; --t3:#2c58a5; --t3-soft:#dde6f6;
  --t4:#16705d; --t4-soft:#d3ebe4; --t5:#5a48ad; --t5-soft:#e6e2f7;
  --good:#2b7a4b; --good-soft:#dbefe1; --bad:#b03c35; --bad-soft:#f7e0dd; --warn:#94650c; --info:#2c58a5; --info-soft:#dde6f6;
  --shadow:0 1px 0 rgba(26,31,43,.04), 0 10px 30px -18px rgba(26,31,43,.30);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:14px; --tema:var(--t1); --tema-soft:var(--t1-soft);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f131a; --grid:#1a202b; --surface:#161b24; --surface-2:#202733; --ink:#e4e8ef; --muted:#9ba5b6; --line:#2b3340;
  --t1:#ee86b6; --t1-soft:#3a1a2b; --t2:#e8a95b; --t2-soft:#36271a; --t3:#86aaf0; --t3-soft:#1a2740;
  --t4:#5cc6aa; --t4-soft:#15302a; --t5:#ab9cf2; --t5-soft:#272143;
  --good:#5cc08a; --good-soft:#163222; --bad:#ec7d72; --bad-soft:#3a1d1a; --warn:#e2b456; --info:#86aaf0; --info-soft:#1a2740;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f131a; --grid:#1a202b; --surface:#161b24; --surface-2:#202733; --ink:#e4e8ef; --muted:#9ba5b6; --line:#2b3340;
  --t1:#ee86b6; --t1-soft:#3a1a2b; --t2:#e8a95b; --t2-soft:#36271a; --t3:#86aaf0; --t3-soft:#1a2740;
  --t4:#5cc6aa; --t4-soft:#15302a; --t5:#ab9cf2; --t5-soft:#272143;
  --good:#5cc08a; --good-soft:#163222; --bad:#ec7d72; --bad-soft:#3a1d1a; --warn:#e2b456; --info:#86aaf0; --info-soft:#1a2740;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark }
[data-tema="t1"]{--tema:var(--t1);--tema-soft:var(--t1-soft)}
[data-tema="t2"]{--tema:var(--t2);--tema-soft:var(--t2-soft)}
[data-tema="t3"]{--tema:var(--t3);--tema-soft:var(--t3-soft)}
[data-tema="t4"]{--tema:var(--t4);--tema-soft:var(--t4-soft)}
[data-tema="t5"]{--tema:var(--t5);--tema-soft:var(--t5-soft)}
html{font-size:16px}
html.proj{font-size:20px}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0}
h2{font-size:clamp(1.7rem,3.6vw,2.6rem);font-weight:800;letter-spacing:-.015em}
h3{font-size:1.18rem;font-weight:700;letter-spacing:-.005em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tema);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
sup,sub{line-height:0}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:transform .25s ease}
.top.escondido{transform:translateY(-130%)}
.top-in{max-width:1280px;margin:0 auto;padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0}
.brand-meta{color:var(--muted);font-size:.85rem}
.brand-tools{margin-left:auto;display:flex;gap:6px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:.9rem;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
nav.tabs button b{font-family:var(--f-mono);font-weight:600;font-size:.74rem;color:var(--tema)}
nav.tabs button:hover{color:var(--ink);background:var(--surface)}
nav.tabs button[aria-current="true"]{color:var(--ink);background:var(--tema-soft);border-color:color-mix(in srgb,var(--tema) 35%,transparent);font-weight:700}
nav.tabs .sep{flex:none;width:1px;background:var(--line);margin:4px 2px}
@media (max-width:640px){.brand-meta,.brand-tools{display:none}.top-in{padding-block:8px 6px;gap:6px}.brand-name{font-size:1.05rem}nav.tabs button{padding:5px 10px;font-size:.85rem}}

main{max-width:1280px;margin:0 auto;padding-block:28px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section.aula{display:flex;flex-direction:column;gap:22px}

/* Faixa de abertura de cada aula */
.aula-head{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:22px;row-gap:6px;align-items:start;padding:24px 26px;background:var(--tema-soft);border-radius:20px;border:1px solid color-mix(in srgb,var(--tema) 22%,transparent)}
.aula-head>*{grid-column:2;position:relative;z-index:1;max-width:74ch}
.aula-badge{grid-column:1!important;grid-row:1/5;align-self:center;width:88px;height:88px;border-radius:18px;background:var(--tema);color:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.aula-badge-k{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.aula-badge-n{font-family:var(--f-display);font-weight:800;font-size:2rem;letter-spacing:-.02em;margin-top:4px}
.aula-wm{position:absolute!important;right:-14px;bottom:-30px;color:var(--tema);opacity:.13;z-index:0!important;grid-column:auto!important;pointer-events:none}
@media (max-width:640px){.aula-head{grid-template-columns:minmax(0,1fr);padding:20px}.aula-head>*{grid-column:1}.aula-badge{grid-row:auto;width:auto;height:auto;flex-direction:row;gap:8px;padding:6px 12px;justify-self:start;border-radius:10px}.aula-badge-n{font-size:1.2rem;margin:0}}
.eyebrow{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tema);font-weight:600}
.lede{color:var(--muted);font-size:1.05rem}
.aula-head .lede{color:var(--ink);opacity:.85}
.base{font-size:.86rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* Componentes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.92rem;line-height:1.2;transition:border-color .15s,transform .15s}
.btn:hover{border-color:var(--tema)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--tema);border-color:var(--tema);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn.big{padding:12px 22px;font-size:1.05rem;text-decoration:none}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.cols.wl{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.cols.wr{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.cols,.cols.wl,.cols.wr,.cols.three{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 13px;cursor:pointer;font-weight:700;border-right:1px solid var(--line);min-width:2.6em}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--tema);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.9rem}
.chip:hover{border-color:var(--tema)}
.chip[aria-pressed="true"]{background:var(--tema);border-color:var(--tema);color:var(--surface);font-weight:700}
.label{font-size:.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.note{font-size:.86rem;color:var(--muted)}
.callout{border-left:4px solid var(--tema);background:var(--tema-soft);padding:11px 15px;border-radius:0 10px 10px 0}
.model{font-size:.84rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.model::before{content:"Modelo didático";flex:none;font-family:var(--f-mono);font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);padding:2px 7px;border-radius:6px;margin-top:1px}
.fb{padding:10px 14px;border-radius:10px;font-size:.95rem}
.fb.ok{background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 55%,transparent)}
.fb.no{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 55%,transparent)}
.fb.info{background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 45%,transparent)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.no{background:var(--bad-soft);color:var(--bad)} .pill.ex{background:var(--tema-soft);color:var(--tema)}
input[type=number],input[type=text],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input.num{width:5.5em;font-family:var(--f-mono)}
input[type=range]{accent-color:var(--tema);width:100%}
input[type=checkbox]{accent-color:var(--tema);width:1.05em;height:1.05em}
.tbl-wrap{overflow-x:auto;max-width:100%}
table.data{border-collapse:collapse;width:100%;font-size:.92rem}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
table.data th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.data td.n,table.data th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.big-num{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat{display:flex;flex-direction:column;gap:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.stat-box{background:var(--surface-2);border-radius:10px;padding:10px 12px}
svg text{font-family:var(--f-body)}
.chart{width:100%;height:auto;display:block;max-width:min(100%,780px);margin-inline:auto}
.stack>.btn,.panel>.btn{align-self:flex-start}

/* Início */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:36px;align-items:center;padding:12px 0 18px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(2.6rem,7vw,5rem);font-weight:800;letter-spacing:-.035em;line-height:.95}
.hero h1 span{display:block;color:var(--t1);font-weight:500}
.hero .lede{font-size:1.12rem;max-width:54ch}
.hero-facts{display:flex;gap:26px;flex-wrap:wrap;padding-top:6px}
.hero-facts div{display:flex;flex-direction:column}
.hero-facts b{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.hero-facts span{font-size:.82rem;color:var(--muted)}
.book-src{font-size:.88rem;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--t3);border-radius:0 10px 10px 0;padding:10px 14px;max-width:62ch}
.hero-art{display:flex;flex-direction:column;align-items:center;gap:10px}
.hero-svg{width:100%;max-width:500px;height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.18))}
.hero-cap{font-size:.82rem;color:var(--muted);text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cards-group{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tema);font-weight:600;padding-top:14px}
.cards-group::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--tema) 30%,transparent)}
.cards-dot{width:10px;height:10px;border-radius:50%;background:var(--tema)}
.tool-card{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:180px;box-shadow:var(--shadow);transition:transform .18s,border-color .18s}
.tool-card:hover{border-color:var(--tema);transform:translateY(-2px)}
.tc-top{display:flex;align-items:flex-start;justify-content:space-between}
.tc-ic{width:48px;height:48px;border-radius:14px;background:var(--tema-soft);color:var(--tema);display:grid;place-items:center}
.tc-n{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1;color:var(--tema);letter-spacing:-.03em;display:flex;flex-direction:column;align-items:flex-end}
.tc-n small{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.tool-card h3{font-size:1.18rem}
.tool-card p{color:var(--muted);font-size:.9rem}
.tc-go{margin-top:auto;font-weight:700;font-size:.86rem;color:var(--tema)}
.refs{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted)}

/* Ilustrações */
.ilu{width:100%;max-width:100%;height:auto;display:block;border-radius:12px;background:var(--surface-2);aspect-ratio:4/3}
.ilu-card{max-width:180px;margin:0 auto}
.ilu-sm{max-width:110px}

/* Para começar */
.abertura{display:flex;flex-direction:column;gap:14px;background:linear-gradient(135deg,var(--tema-soft),var(--surface) 70%);border:1px dashed color-mix(in srgb,var(--tema) 55%,transparent);border-radius:20px;padding:22px}
.ab-head{display:flex;flex-direction:column;gap:4px}
.ab-tag{align-self:flex-start;background:var(--tema);color:var(--surface);font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.ab-body{display:flex;flex-direction:column;gap:12px}
.ab-body>.btn{align-self:flex-start}
.ab-choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ab-choice{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;cursor:pointer;font-weight:700}
.ab-choice[aria-pressed="true"]{border-color:var(--tema);background:var(--tema-soft)}
.ab-choice .ilu{max-width:200px}
.ab-q{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ab-sem{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.sem{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;opacity:.35}
.sem.g{background:#2b7a4b}.sem.y{background:#d9a21b}.sem.r{background:#b03c35}
.sem[aria-pressed="true"]{opacity:1;border-color:var(--ink)}
.ab-recap{border-left:4px solid var(--tema);background:var(--tema-soft);border-radius:0 12px 12px 0;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
@media (max-width:520px){.abertura{padding:16px}}

/* Ficha de respostas */
.ficha{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:2px solid var(--tema);border-radius:20px;padding:24px;box-shadow:var(--shadow);scroll-margin-top:130px}
.ficha-head{display:flex;flex-direction:column;gap:4px}
.ficha-id{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:14px;background:var(--tema-soft);border-radius:12px}
.ficha-id input[type=text]{width:100%}
.ficha-itens{display:flex;flex-direction:column;gap:14px}
.ficha-item{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ficha-item:last-child{border-bottom:0}
.ficha-item input[type=text]{max-width:340px}
.ficha-item textarea{width:100%;resize:vertical}
.ficha-q{font-weight:700}
.ficha-q b{color:var(--tema);margin-right:2px}
.ficha-send{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ficha-jump{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:640px){.ficha{padding:16px}}

.menu-flutuante{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s,transform .2s}
.menu-flutuante.visivel{opacity:1;pointer-events:auto;transform:none}
.sim{border:2px solid color-mix(in srgb,var(--tema) 45%,transparent);background:linear-gradient(180deg,var(--tema-soft),var(--surface) 140px)}
.sim canvas{border-radius:12px}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .25s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Componentes específicos deste site ===== */
.bancada-wrap{border:2px solid color-mix(in srgb,var(--tema) 40%,transparent)}
.bancada{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:18px;align-items:start}
@media (max-width:1150px){.bancada{grid-template-columns:minmax(0,1fr) 260px}.bancada .lst{grid-column:1/-1}}
@media (max-width:760px){.bancada{grid-template-columns:minmax(0,1fr)}}
.lst-items{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto;padding:2px}
@media (max-width:1150px){.lst-items{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}}
.lam-btn{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 10px 5px 5px;cursor:pointer;flex:none;min-width:0}
@media (max-width:1150px){.lam-btn{width:220px}}
.lam-btn img{width:44px;height:44px;border-radius:50%;flex:none;background:#0b0f0d}
.lam-btn[aria-pressed="true"]{border-color:var(--tema);background:var(--tema-soft);box-shadow:0 0 0 2px var(--tema) inset}
.campo{background:#0b0f0d;border-radius:20px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.campo-vis{position:relative;width:100%;max-width:560px;aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden}
.campo canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab;border-radius:50%}
.campo .campo-ov{position:absolute;inset:0;pointer-events:none;border-radius:0}
.campo-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#cfd8d2;font-family:var(--f-mono);font-size:.78rem}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl-box{background:var(--surface-2);border-radius:14px;padding:14px}
.charriot{display:grid;grid-template-columns:repeat(3,46px);gap:4px;justify-content:center}
.charriot .btn{padding:8px 0}
.est-list{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px}
.thumb{width:100%;aspect-ratio:1;max-width:180px;border-radius:50%;align-self:center;background:#0b0f0d}
.scope-map .hot{cursor:pointer}
.scope-map .hot text{transition:fill .15s}
.scope-map .hot:hover text,.scope-map .hot.on text{fill:var(--t1);text-decoration:underline}
.scope-map .hot:focus-visible{outline:none}
.scope-map .hot:focus-visible text{fill:var(--t1);text-decoration:underline}

// Registro de quais chaves cada aula usa, para o botão “Recomeçar esta aula”
const RST={cur:null,glob:new Set()};(function(){const g=store.get,st=store.set;const note=k=>{k=String(k);if(k.startsWith('__'))return;if(!RST.cur){RST.glob.add(k);return;}if(RST.glob.has(k))return;const K='__keys-'+RST.cur;const L=g.call(store,K,[]);if(!L.includes(k)){L.push(k);st.call(store,K,L);}};store.get=function(k,d){note(k);return g.call(store,k,d);};store.set=function(k,v){note(k);st.call(store,k,v);};store.del=function(k){try{localStorage.removeItem((window.PORTAL?PORTAL.pfx(SITE.chave):SITE.chave+'-')+k)}catch(e){}};})();

// Gráfico de barras agrupadas (SVG)
function barChart(svg,{cats,series,yMax,yLabel,xLabel,height=260,fmtY=v=>fmt(v)}){
  const W=640,H=height,ml=52,mr=14,mt=series.length>1?30:14,mb=xLabel?52:34;svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const step=(()=>{const raw=yMax/5;const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const m=raw/p;return(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;})();
  const top=Math.max(step,Math.ceil(yMax/step)*step);const ys=v=>H-mb-(v/top)*(H-mt-mb);
  for(let v=0;v<=top+1e-9;v+=step){svg.append(s('line',{x1:ml,x2:W-mr,y1:ys(v),y2:ys(v),stroke:'var(--line)'}));svg.append(s('text',{x:ml-8,y:ys(v)+4,'text-anchor':'end','font-size':12,fill:'var(--muted)'},fmtY(v)));}
  const bw=(W-ml-mr)/cats.length;const inner=Math.min(46,(bw-14)/series.length);
  cats.forEach((c,i)=>{const x0=ml+i*bw+(bw-inner*series.length)/2;
    series.forEach((se,j)=>{const v=se.values[i];if(v==null)return;const x=x0+j*inner;
      if(se.dash){svg.append(s('rect',{x:x+2,y:ys(v),width:inner-4,height:Math.max(0,ys(0)-ys(v)),fill:'none',stroke:se.color,'stroke-width':2,'stroke-dasharray':'5 4'}));}
      else svg.append(s('rect',{x:x+2,y:ys(v),width:inner-4,height:Math.max(0,ys(0)-ys(v)),rx:3,fill:se.color}));
      if(se.labels)svg.append(s('text',{x:x+inner/2,y:ys(v)-5,'text-anchor':'middle','font-size':11,'font-weight':700,fill:'var(--ink)'},se.labels(v)));});
    svg.append(s('text',{x:ml+i*bw+bw/2,y:H-mb+18,'text-anchor':'middle','font-size':13,'font-weight':700,fill:'var(--ink)','font-family':'var(--f-mono)'},c));});
  svg.append(s('line',{x1:ml,x2:W-mr,y1:ys(0),y2:ys(0),stroke:'var(--muted)'}));
  if(xLabel)svg.append(s('text',{x:(ml+W-mr)/2,y:H-8,'text-anchor':'middle','font-size':12.5,'font-weight':700,fill:'var(--ink)'},xLabel));
  if(yLabel)svg.append(s('text',{x:14,y:(mt+H-mb)/2,'text-anchor':'middle','font-size':12.5,'font-weight':700,fill:'var(--ink)',transform:`rotate(-90 14 ${(mt+H-mb)/2})`},yLabel));
  if(series.length>1){let lx=ml;series.forEach(se=>{svg.append(s('rect',{x:lx,y:8,width:16,height:12,rx:2,fill:se.dash?'none':se.color,stroke:se.color,'stroke-width':2,'stroke-dasharray':se.dash?'4 3':null}));svg.append(s('text',{x:lx+22,y:18,'font-size':12.5,fill:'var(--ink)'},se.name));lx+=34+se.name.length*7;});}
}

const P=(g,pts,fill,stroke,lw,close=true)=>{g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));if(close)g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1;g.stroke();}};
const L=(g,x1,y1,x2,y2,c,lw)=>{g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=c;g.lineWidth=lw;g.stroke();};
function wrapAt(T,mode,x,y,r,fn){const xs=[0],ys=[0];if(mode!=='repeat-y'){if(x-r<0)xs.push(T[0]);if(x+r>T[0])xs.push(-T[0]);}if(mode!=='repeat-x'){if(y-r<0)ys.push(T[1]);if(y+r>T[1])ys.push(-T[1]);}for(const dx of xs)for(const dy of ys)fn(x+dx,y+dy);}
function splitLen(r,total,min,max){const out=[];let acc=0;while(acc<total){let l=min+r()*(max-min);if(total-acc-l<min)l=total-acc;out.push(l);acc+=l;}return out;}
// Voronoi periódico (para células poligonais)
function voronoi(sites,T){const res=[];const near=(a,b)=>{let dx=b[0]-a[0],dy=b[1]-a[1];dx-=Math.round(dx/T[0])*T[0];dy-=Math.round(dy/T[1])*T[1];return[a[0]+dx,a[1]+dy];};
  sites.forEach((s,i)=>{let poly=[[s[0]-200,s[1]-200],[s[0]+200,s[1]-200],[s[0]+200,s[1]+200],[s[0]-200,s[1]+200]];
    sites.forEach((o,j)=>{if(i===j)return;const q=near(s,o);const dx=q[0]-s[0],dy=q[1]-s[1];if(dx*dx+dy*dy>200*200)return;const mx=(s[0]+q[0])/2,my=(s[1]+q[1])/2;
      const inside=p=>(p[0]-mx)*dx+(p[1]-my)*dy<=0;const out=[];for(let k=0;k<poly.length;k++){const a=poly[k],b=poly[(k+1)%poly.length];const ia=inside(a),ib=inside(b);if(ia)out.push(a);if(ia!==ib){const da=(a[0]-mx)*dx+(a[1]-my)*dy,db=(b[0]-mx)*dx+(b[1]-my)*dy;const t=da/(da-db);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}}poly=out;});
    res.push(poly);});return res;}
function jitterGrid(r,T,step,j){const s=[];for(let y=step/2;y<T[1];y+=step)for(let x=step/2;x<T[0];x+=step)s.push([x+(r()-.5)*step*j,y+(r()-.5)*step*j]);return s;}

  for(let k=0;k<n;k++){const p=pts[k],e=md(p,pts[(k+1)%n]);g.quadraticCurveTo(p[0]+ox,p[1]+oy,e[0],e[1]);}g.closePath();}
